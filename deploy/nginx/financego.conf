# FinanceGo vhost for the shared VPS nginx (/opt/sga/nginx/app.conf, between the financego markers).
# nginx reaches this stack only through the edge-financego network (alias financego-edge).
server {
    listen 80;
    server_name finance-go.jesuslab135.com;

    # Must stay reachable over plain HTTP: this is how certbot renews.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name finance-go.jesuslab135.com;

    ssl_certificate     /etc/letsencrypt/live/finance-go.jesuslab135.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance-go.jesuslab135.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 2M;

    # Per-request resolution so a redeploy (new container IP) never 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $financego_edge financego-edge:80;
        proxy_pass http://$financego_edge$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
