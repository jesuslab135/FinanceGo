info:
  contact: {}
  title: Finance API
  version: "1.0"
paths:
  /account-movements:
    post:
      consumes:
      - application/json
      parameters:
      - description: movement
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.AccountMovementInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.AccountMovement'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Record a deposit, withdrawal or transfer
      tags:
      - savings
  /account-movements/{id}:
    delete:
      parameters:
      - description: movement id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a movement
      tags:
      - savings
    put:
      consumes:
      - application/json
      parameters:
      - description: movement id
        in: path
        name: id
        required: true
        type: integer
      - description: movement
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.AccountMovementInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AccountMovement'
      security:
      - BearerAuth: []
      summary: Replace a movement
      tags:
      - savings
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.loginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
