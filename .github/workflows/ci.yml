name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v '^internal/store/' | grep -v '^docs/')"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: api
          version: v2.14.0 # pinned: v2.5.0 predates Go 1.26 (go.mod)
      - name: tests (integration via testcontainers)
        run: go test ./...
      - name: generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          sqlc generate
          swag init -g cmd/api/main.go -o docs --parseInternal
          git status --porcelain -- internal/store docs
          test -z "$(git status --porcelain -- internal/store docs)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t financego-api ./api
      - run: docker build -t financego-web ./web

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API types are current
        run: pnpm gen:api && git diff --exit-code -- src/lib/api
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [web]
    env:
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-bytes!!
      AUTH_RATE_PER_MIN: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: docker compose -f docker-compose.yml up -d --build
      - name: wait for the web app
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:3000/es/login >/dev/null && exit 0; sleep 2; done
          docker compose -f docker-compose.yml logs; exit 1
      - working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
